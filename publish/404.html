<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f7fa;
      color: rgba(0, 0, 0, 0.88);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      background: #ffffff;
      border: 1px solid #e7ebf3;
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }
    .code {
      font-size: 96px;
      font-weight: 700;
      background: linear-gradient(135deg, #25D366, #128C7E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: rgba(0, 0, 0, 0.55);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 24px;
      background: #128C7E;
      color: #ffffff;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.btn:hover { background: #075E54; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>您访问的页面已被移除、重命名或暂时不可用。</p>
    <a class="btn" href="./">返回首页</a>
  </div>
</body>
</html>
